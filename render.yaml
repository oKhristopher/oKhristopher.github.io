services:
  - type: web
    name: palavra-viva
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: ID_SALT
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: palavra-viva-usage
          property: connectionString

databases:
  - name: palavra-viva-usage
    databaseName: palavra_viva_usage
    user: palavra_viva_user
    plan: free
    region: ohio
