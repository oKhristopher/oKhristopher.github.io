name: Palavra Viva security checks

on:
  push:
    branches:
      - security-hardening
  pull_request:
    branches:
      - deploy/palavra-viva-v2

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact locked dependency versions
        run: npm ci --prefix _audit_source --ignore-scripts
      - name: Check for known vulnerable dependencies
        run: npm audit --prefix _audit_source --omit=dev --audit-level=high
      - name: Build the deployable app from audited sources
        run: npm run build
      - name: Check JavaScript syntax
        run: |
          node --check _audit_source/server.cjs
          node --check _audit_source/public/app.js
          node --check runtime-app/server.cjs
          node --check runtime-app/public/app.js
      - name: Run security regression tests
        run: npm test --prefix _audit_source
      - name: Check public files for server-only secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE 'GEMINI_API_KEY|DATABASE_URL|ID_SALT|x-goog-api-key|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' _audit_source/public; then
            echo "Potential server secret found in public files"
            exit 1
          fi
